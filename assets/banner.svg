<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Roblox Master Skills banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <!-- Stacked studs / blocks motif -->
  <g transform="translate(990 170)">
    <g transform="rotate(-8)">
      <rect x="0" y="80" width="150" height="70" rx="10" fill="#22d3ee" fill-opacity="0.85"/>
      <rect x="20" y="64" width="34" height="18" rx="6" fill="#22d3ee"/>
      <rect x="96" y="64" width="34" height="18" rx="6" fill="#22d3ee"/>
    </g>
    <g transform="translate(40 -78) rotate(6)">
      <rect x="0" y="80" width="150" height="70" rx="10" fill="#a78bfa" fill-opacity="0.9"/>
      <rect x="20" y="64" width="34" height="18" rx="6" fill="#a78bfa"/>
      <rect x="96" y="64" width="34" height="18" rx="6" fill="#a78bfa"/>
    </g>
    <g transform="translate(6 -150) rotate(-4)">
      <rect x="0" y="80" width="150" height="70" rx="10" fill="#f472b6" fill-opacity="0.9"/>
      <rect x="20" y="64" width="34" height="18" rx="6" fill="#f472b6"/>
      <rect x="96" y="64" width="34" height="18" rx="6" fill="#f472b6"/>
    </g>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="80" y="120" fill="#94a3b8" font-size="22" font-weight="600" letter-spacing="4">FOR AI AGENTS · CLAUDE · CHATGPT · CURSOR</text>
    <text x="80" y="200" fill="#ffffff" font-size="76" font-weight="800">Roblox Master Skills</text>
    <rect x="82" y="224" width="220" height="6" rx="3" fill="url(#accent)"/>
    <text x="80" y="282" fill="#e2e8f0" font-size="28" font-weight="500">Luau standards · RemoteEvent security · Map &amp; playability</text>
    <text x="80" y="324" fill="#e2e8f0" font-size="28" font-weight="500">AI error log · Blender bpy prompts · Growing skill library</text>
  </g>
</svg>
